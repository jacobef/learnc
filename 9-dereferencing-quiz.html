<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>C Boxes — 9. Dereferencing Quiz</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrap">
            <div class="main">
                <h1 class="page-title">Dereferencing Quiz</h1>
                <p data-role="quiz-instructions" class="intro"></p>

                <section>
                    <div class="quiz-row">
                        <div class="panel quiz-expression-panel">
                            <div class="panel-title">Expression</div>
                            <div
                                data-role="quiz-expression"
                                class="expr-display"
                            ></div>
                        </div>
                        <div class="panel program-state-panel">
                            <div class="panel-title">Program state</div>
                            <div
                                data-role="quiz-streak"
                                class="quiz-streak"
                            ></div>
                            <div class="controls controls-top">
                                <button data-role="quiz-check">Check</button>
                                <button data-role="quiz-next">
                                    Next Program ▶▶
                                </button>
                                <span
                                    data-role="quiz-status"
                                    class="muted"
                                ></span>
                            </div>
                            <div data-role="quiz-stage" class="grid"></div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <script type="module" src="js/9-dereferencing-quiz.js"></script>
    </body>
</html>
