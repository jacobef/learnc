[package]
name = "c_interpreter"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cboxes-sqlite"
path = "src/bin/cboxes_sqlite.rs"

[features]
default = ["native-mimalloc", "pure-expression-precompute"]
native-mimalloc = ["dep:mimalloc"]
pure-expression-precompute = []

[dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "symbols"

# Native profiling and long-running analysis favor evaluator throughput. The tutorial Wasm build
# deliberately continues to use the size-optimized `release` profile above.
[profile.analysis]
inherits = "release"
lto = "fat"
opt-level = 3
