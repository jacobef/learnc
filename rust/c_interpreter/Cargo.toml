[package]
name = "c_interpreter"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "symbols"

# Native profiling and long-running analysis favor evaluator throughput. The tutorial Wasm build
# deliberately continues to use the size-optimized `release` profile above.
[profile.analysis]
inherits = "release"
lto = "fat"
opt-level = 3
