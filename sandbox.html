<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>C Boxes — Sandbox</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrap">
            <nav class="tabs">
                <a href="index.html">Home</a>
                <a href="program1.html">1. Assignment I</a>
                <a href="program2.html">2. Declaration</a>
                <a href="program3.html">3. Initialization</a>
                <a href="program4.html">4. Code Editing I</a>
                <a href="program5.html">5. Code Editing II</a>
                <a href="program6.html">6. Assignment II</a>
                <a href="program7.html">7. Pointers</a>
                <a href="program8.html">8. Dereferencing</a>
                <a href="dereferencing-quiz.html">Dereferencing Quiz</a>
                <a href="program9.html">9. Whitespace &amp; Comments</a>
                <a href="program10.html">10. Integer Arithmetic</a>
                <a href="program11.html">11. Assignment III</a>
                <a href="program12.html">12. Review</a>
                <a href="sandbox.html" class="active">Sandbox</a>
            </nav>
            <div class="main">
                <p data-role="sandbox-instructions" class="intro"></p>

                <section>
                    <div class="row">
                        <div class="panel">
                            <div class="panel-title code-title">Code</div>
                            <div data-role="sandbox-code" class="codepane">
                                <div class="codepane-row">
                                    <div
                                        data-role="sandbox-line-numbers"
                                        class="code-gutter"
                                        aria-hidden="true"
                                    ></div>
                                    <div class="code-editor-wrap">
                                        <textarea
                                            data-role="sandbox-editor"
                                            class="code-textarea"
                                            spellcheck="false"
                                            rows="4"
                                        ></textarea>
                                    </div>
                                    <div
                                        data-role="sandbox-error-gutter"
                                        class="code-error-gutter"
                                        aria-hidden="true"
                                    ></div>
                                </div>
                            </div>
                            <div
                                data-role="sandbox-error-detail"
                                class="hint-inline hidden"
                            ></div>
                            <div class="controls">
                                <button data-role="sandbox-prev">
                                    Back ◀
                                </button>
                                <button data-role="sandbox-next">
                                    Run line 1 ▶
                                </button>
                            </div>
                        </div>
                        <div
                            class="panel program-state-panel sandbox-state-panel"
                        >
                            <div class="panel-title">Program state</div>
                            <div data-role="sandbox-stage"></div>
                            <div class="expr-panel">
                                <label class="expr-title">
                                    Evaluate expression
                                </label>
                                <input
                                    data-role="sandbox-expr"
                                    class="expr-input"
                                    type="text"
                                    spellcheck="false"
                                />
                                <div
                                    data-role="sandbox-expr-result"
                                    class="grid"
                                ></div>
                                <div
                                    data-role="sandbox-expr-error"
                                    class="hint-inline hidden"
                                ></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <script src="js/shared-core.js"></script>
        <script src="js/shared-program-template.js"></script>
        <script src="js/shared-code-editor.js"></script>
        <script src="js/confetti.js"></script>
        <script src="js/sandbox.js"></script>
    </body>
</html>
