<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>C Boxes — Sandbox</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrap">
            <div class="main">
                <section class="panel-shell sandbox-shell">
                    <div class="controls-bar">
                        <div class="controls-main panel panel-controls">
                            <div class="controls-row controls-left">
                                <button
                                    data-role="sandbox-prev"
                                    data-stepper="prev"
                                >
                                    Back ◀
                                </button>
                                <button
                                    data-role="sandbox-next"
                                    data-stepper="next"
                                >
                                    Run line 1 ▶
                                </button>
                            </div>
                            <div class="controls-row controls-right"></div>
                        </div>
                        <p data-role="sandbox-instructions" class="intro"></p>
                    </div>
                    <div class="row panel-row">
                        <div class="panel panel-scroll">
                            <div class="panel-title code-title">Code</div>
                            <div
                                data-role="sandbox-code"
                                class="codepane panel-body"
                            >
                                <div class="codepane-row">
                                    <div
                                        data-role="sandbox-line-numbers"
                                        class="code-gutter"
                                        aria-hidden="true"
                                    ></div>
                                    <div class="code-editor-wrap">
                                        <textarea
                                            data-role="sandbox-editor"
                                            class="code-textarea"
                                            spellcheck="false"
                                            rows="4"
                                        ></textarea>
                                    </div>
                                    <div
                                        data-role="sandbox-error-gutter"
                                        class="code-error-gutter"
                                        aria-hidden="true"
                                    ></div>
                                </div>
                            </div>
                            <div
                                data-role="sandbox-error-detail"
                                class="hint-inline hidden"
                            ></div>
                        </div>
                        <div
                            class="panel program-state-panel sandbox-state-panel panel-scroll"
                        >
                            <div class="panel-title">Program state</div>
                            <div data-role="sandbox-stage" class="panel-body"></div>
                            <div class="expr-panel">
                                <div class="sandbox-expr-row">
                                    <div class="sandbox-expr-input-wrap">
                                        <label class="expr-title">
                                            Evaluate expression
                                        </label>
                                        <input
                                            data-role="sandbox-expr"
                                            class="expr-input"
                                            type="text"
                                            spellcheck="false"
                                        />
                                    </div>
                                    <div
                                        data-role="sandbox-expr-result"
                                        class="grid"
                                    ></div>
                                </div>
                                <div
                                    data-role="sandbox-expr-error"
                                    class="hint-inline hidden"
                                ></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <script type="module" src="js/sandbox.js"></script>
    </body>
</html>
